server:
  port: 8080

spring:
  application:
    name: avaliance-copilot-backend-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false

  flyway:
    enabled: false

  h2:
    console:
      enabled: false

app:
  admin:
    username: admin
    password: admin123

  jwt:
    secret: test-secret-key-that-is-at-least-64-characters-long-for-hs256-algorithm-testing
    expiration-ms: 3600000

  ia-service:
    base-url: http://localhost:9999
    internal-token: test-internal-token

  cors:
    allowed-origins: http://localhost:3000

  document-storage:
    path: ${java.io.tmpdir}/avaliance-copilot-test-documents

logging:
  level:
    com.avaliance.copilot: DEBUG
