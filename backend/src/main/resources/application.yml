server:
  port: 8080
  compression:
    enabled: false

spring:
  application:
    name: avaliance-copilot-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:avaliance}
    username: ${DB_USERNAME:copilot}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

# Application configuration
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  ia-service:
    base-url: ${IA_SERVICE_URL:http://service-ia:8000}
    internal-token: ${INTERNAL_TOKEN}
    connect-timeout-ms: ${IA_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${IA_READ_TIMEOUT_MS:180000}
    stub-enabled: ${IA_STUB_ENABLED:false}

  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD}

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

  document-storage:
    path: ${DOCUMENT_STORAGE_PATH:/data/documents}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.avaliance.copilot: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
